[package]
name = "fenc"
version = "0.1.0"
edition = "2021"
authors = ["fantasywastaken"]
description = "Stream-based file encryption CLI using AES-256-GCM and Argon2id"
license = "MIT"

[[bin]]
name = "fenc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
colored = "2.1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
rpassword = "7"

[profile.release]
opt-level = 3
lto = true
strip = true
